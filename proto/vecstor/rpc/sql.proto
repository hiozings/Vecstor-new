syntax = "proto3";
package vecstor.v2;
import "vecstor/rpc/services.proto";

message ControlRequest {
  string action = 1;
  string database_id = 2;
  string name = 3;
  bool create = 4;
  string source = 5;
  string table = 6;
  string operation_id = 7;
}
message ControlResponse { string json_result = 1; }
message SearchOptions {
  string mode = 1;
  string path = 2;
  optional uint32 nprobe = 3;
  optional uint32 candidates = 4;
  optional uint32 max_candidates = 5;
  optional uint32 max_rounds = 6;
  string fallback = 7;
  string quality_profile_id = 8;
  string device = 9;
  optional uint32 gpu_id = 10;
  string device_fallback = 11;
  string candidate_data_path = 12;
}
message QueryExecutionPlan { string json_payload = 1; }
message SQLRequest { string database_id = 1; string sql = 2; string operation_id = 3; SearchOptions search_options = 4; }
message Column { string name = 1; string type = 2; }
message VectorValue { repeated double values = 1; }
message Cell {
  oneof value {
    bool null_value = 1;
    bool boolean = 2;
    int64 integer = 3;
    double number = 4;
    string text = 5;
    VectorValue vector = 6;
  }
}
message SQLRow { repeated Cell cells = 1; }
message ResultFrame {
  enum Kind { SCHEMA = 0; ROWS = 1; COMPLETE = 2; }
  Kind kind = 1;
  repeated Column columns = 2;
  repeated SQLRow rows = 3;
  optional int64 affected_rows = 4;
  string operation_id = 5;
  uint64 revision = 6;
  double elapsed_seconds = 7;
  string selected_database_id = 8;
  string selected_database_name = 9;
  string execution_path = 10;
  QueryExecutionPlan execution_plan = 11;
}
message BeginReadRequest { string database_id = 1; string table = 2; double ttl_seconds = 3; }
message ReadLease {
  string token = 1;
  string database_id = 2;
  string table_id = 3;
  uint64 revision = 4;
  string schema_version = 5;
  uint32 dimension = 6;
  string table = 7;
  optional uint64 row_count = 8;
  uint32 index_publication_version = 9;
  uint64 publication_generation = 10;
  IndexArtifactDescriptor published_index = 11;
  string published_index_state = 12;
  string storage_epoch = 13;
  double effective_ttl_seconds = 14;
}
message LeaseRequest { string database_id = 1; string token = 2; }
message ScanRequest { string database_id = 1; string token = 2; string sql = 3; uint32 batch_rows = 4; }
message MetadataBatch {
  string token = 1;
  uint64 revision = 2;
  uint64 total_rows = 3;
  uint64 offset = 4;
  repeated vecstor.v1.Row rows = 5;
}
message FetchRequest { string database_id = 1; string token = 2; repeated int64 ids = 3; }
message VectorBatch {
  string token = 1;
  uint64 revision = 2;
  uint32 dimension = 3;
  repeated int64 ids = 4;
  bytes vectors_f32_le = 5;
}
message SnapshotRequest { string database_id = 1; string token = 2; uint32 batch_rows = 3; }
message SnapshotBatch {
  string token = 1;
  uint64 revision = 2;
  string table_id = 3;
  string schema_version = 4;
  uint32 dimension = 5;
  uint64 total_rows = 6;
  uint64 offset = 7;
  repeated int64 ids = 8;
  bytes vectors_f32_le = 9;
  bool snapshot_complete = 10;
  string snapshot_sha256 = 11;
}
message CandidateRequest { string database_id = 1; string token = 2; string sql = 3; repeated int64 ids = 4; }
message CandidateResult {
  string token = 1;
  uint64 revision = 2;
  uint64 checked_count = 3;
  repeated int64 checked_ids = 4;
  repeated vecstor.v1.Row rows = 5;
}
message FilteredVectorResult {
  string token = 1;
  uint64 revision = 2;
  uint64 checked_count = 3;
  repeated int64 checked_ids = 4;
  repeated vecstor.v1.Row rows = 5;
  uint32 dimension = 6;
  bytes vectors_f32_le = 7;
}
message ProjectedRow {
  optional int64 id = 1;
  optional string category = 2;
  optional int64 timestamp = 3;
  optional double value = 4;
}
message ProjectedScanRequest {
  string database_id = 1;
  string token = 2;
  string sql = 3;
  uint32 batch_rows = 4;
  repeated string fields = 5;
}
message ProjectedMetadataBatch {
  string token = 1;
  uint64 revision = 2;
  uint64 total_rows = 3;
  uint64 offset = 4;
  repeated string fields = 5;
  repeated ProjectedRow rows = 6;
  bool complete = 7;
}
message ProjectedCandidateRequest {
  string database_id = 1;
  string token = 2;
  string sql = 3;
  repeated int64 checked_ids = 4;
  repeated string fields = 5;
  repeated int64 vector_ids = 6;
}
message ProjectedCandidateResult {
  string token = 1;
  uint64 revision = 2;
  repeated int64 checked_ids = 3;
  repeated string fields = 4;
  repeated ProjectedRow rows = 5;
  uint32 dimension = 6;
  repeated int64 vector_ids = 7;
  bytes vectors_f32_le = 8;
}
message BuildIndexRequest {
  string database_id = 1;
  string table = 2;
  optional uint32 nlist = 3;
  optional uint64 seed = 4;
  string device = 5;
  uint32 gpu_id = 6;
}
message IndexRequest { string database_id = 1; string table = 2; string device = 3; }
message IndexIdentity {
  string database_id = 1;
  string table_id = 2;
  uint64 revision = 3;
  string schema_version = 4;
  uint32 dimension = 5;
  string metric = 6;
  string build_fingerprint = 7;
}
message IndexBuildConfig { uint32 nlist = 1; uint64 seed = 2; uint64 train_rows = 3; }
message IndexArtifactDescriptor {
  uint32 format_version = 1;
  string payload_format = 2;
  IndexIdentity key = 3;
  IndexBuildConfig build_config = 4;
  string faiss_version = 5;
  string platform = 6;
  uint64 row_count = 7;
  uint32 nlist = 8;
  uint64 payload_size = 9;
  string payload_sha256 = 10;
  string snapshot_sha256 = 11;
  string artifact_id = 12;
}
message IndexPublicationRecord {
  string operation_id = 1;
  string operation_kind = 2;
  string state = 3;
  string intent_json = 4;
  string intent_digest = 5;
  string request_digest = 6;
  IndexIdentity key = 7;
  uint64 expected_generation = 8;
  uint64 generation = 9;
  IndexArtifactDescriptor descriptor = 10;
  string error_code = 11;
  string error_reason = 12;
  string result_json = 13;
}
message BeginIndexPublicationRequest {
  string database_id = 1;
  string token = 2;
  string operation_id = 3;
  IndexBuildConfig config = 4;
  uint64 expected_generation = 5;
  string intent_json = 6;
}
message IndexArtifactChunk { uint64 offset = 1; bytes data = 2; }
message IndexArtifactComplete { uint64 total_size = 1; string payload_sha256 = 2; }
message IndexUploadFrame {
  string database_id = 1;
  string token = 2;
  string operation_id = 3;
  oneof content {
    IndexArtifactDescriptor header = 4;
    IndexArtifactChunk chunk = 5;
    IndexArtifactComplete trailer = 6;
  }
}
message FinalizeIndexPublicationRequest { string database_id = 1; string token = 2; string operation_id = 3; }
message IndexPublicationRequest { string database_id = 1; string operation_id = 2; }
message ListPublishedIndexesRequest { string database_id = 1; string table = 2; uint32 page_size = 3; string cursor = 4; }
message PublishedIndexStatus { IndexArtifactDescriptor descriptor = 1; string state = 2; uint64 generation = 3; bool matches_current = 4; }
message ListPublishedIndexesResponse { repeated PublishedIndexStatus indexes = 1; string next_cursor = 2; }
message DownloadIndexArtifactRequest { string database_id = 1; string token = 2; string artifact_id = 3; }
message IndexArtifactFrame {
  string database_id = 1;
  string token = 2;
  string artifact_id = 3;
  oneof content {
    IndexArtifactDescriptor descriptor = 4;
    IndexArtifactChunk chunk = 5;
    IndexArtifactComplete complete = 6;
  }
}
message PruneIndexArtifactsRequest {
  string database_id = 1;
  string operation_id = 2;
  optional uint32 keep_last = 3;
  optional bool dry_run = 4;
}
message PruneIndexArtifactsResponse {
  repeated string candidates = 1;
  repeated string protected = 2;
  repeated string deleted = 3;
  uint64 deleted_bytes = 4;
  string state = 5;
  string byte_accounting = 6;
}
message PublishIndexRequest {
  string database_id = 1;
  string table = 2;
  optional uint32 nlist = 3;
  optional uint64 seed = 4;
  string operation_id = 5;
  optional uint64 expected_generation = 6;
}
message PublishIndexResponse { IndexPublicationRecord publication = 1; string statistics_json = 2; }
message LoadIndexRequest {
  string database_id = 1;
  string table = 2;
  string device = 3;
  uint32 gpu_id = 4;
  string expected_artifact_id = 5;
}
message LoadIndexResponse {
  IndexArtifactDescriptor descriptor = 1;
  uint64 publication_generation = 2;
  string device = 3;
  bool reused = 4;
  string statistics_json = 5;
}
message InspectPublishedIndexRequest { string database_id = 1; string table = 2; }
message InspectPublishedIndexResponse {
  IndexArtifactDescriptor descriptor = 1;
  uint64 generation = 2;
  bool cpu_ready = 3;
  bool gpu_ready = 4;
  string state = 5;
  string index_source = 6;
}
service SQLStorage {
  rpc Control(ControlRequest) returns (ControlResponse);
  rpc ExecuteSQL(SQLRequest) returns (stream ResultFrame);
  rpc BeginRead(BeginReadRequest) returns (ReadLease);
  rpc EndRead(LeaseRequest) returns (vecstor.v1.Empty);
  rpc ScanMetadata(ScanRequest) returns (stream MetadataBatch);
  rpc ScanProjectedMetadata(ProjectedScanRequest) returns (stream ProjectedMetadataBatch);
  rpc ReadProjectedCandidates(ProjectedCandidateRequest) returns (ProjectedCandidateResult);
  rpc FetchVectors(FetchRequest) returns (VectorBatch);
  rpc StreamVectorSnapshot(SnapshotRequest) returns (stream SnapshotBatch);
  rpc FilterCandidates(CandidateRequest) returns (CandidateResult);
  rpc FilterCandidateVectors(CandidateRequest) returns (FilteredVectorResult);
  rpc BeginIndexPublication(BeginIndexPublicationRequest) returns (IndexPublicationRecord);
  rpc UploadIndexArtifact(stream IndexUploadFrame) returns (IndexPublicationRecord);
  rpc FinalizeIndexPublication(FinalizeIndexPublicationRequest) returns (IndexPublicationRecord);
  rpc GetIndexPublication(IndexPublicationRequest) returns (IndexPublicationRecord);
  rpc ListPublishedIndexes(ListPublishedIndexesRequest) returns (ListPublishedIndexesResponse);
  rpc DownloadIndexArtifact(DownloadIndexArtifactRequest) returns (stream IndexArtifactFrame);
  rpc PruneIndexArtifacts(PruneIndexArtifactsRequest) returns (PruneIndexArtifactsResponse);
}
service SQLCompute {
  rpc Control(ControlRequest) returns (ControlResponse);
  rpc ExecuteSQL(SQLRequest) returns (stream ResultFrame);
  rpc GetSearchCapabilities(vecstor.v1.Empty) returns (ControlResponse);
  rpc BuildIndex(BuildIndexRequest) returns (ControlResponse);
  rpc ListIndexes(IndexRequest) returns (ControlResponse);
  rpc ClearIndexes(IndexRequest) returns (ControlResponse);
  rpc PublishIndex(PublishIndexRequest) returns (PublishIndexResponse);
  rpc LoadIndex(LoadIndexRequest) returns (LoadIndexResponse);
  rpc InspectPublishedIndex(InspectPublishedIndexRequest) returns (InspectPublishedIndexResponse);
  rpc GetIndexPublication(IndexPublicationRequest) returns (IndexPublicationRecord);
  rpc ListPublishedIndexes(ListPublishedIndexesRequest) returns (ListPublishedIndexesResponse);
  rpc PruneIndexArtifacts(PruneIndexArtifactsRequest) returns (PruneIndexArtifactsResponse);
}
