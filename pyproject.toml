[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vecstor"
version = "0.2.5.dev0"
description = "Disaggregated vector query research prototype"
requires-python = ">=3.12"

[project.scripts]
vecstor = "vecstor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vecstor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
